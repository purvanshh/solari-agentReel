[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentreel"
version = "1.0.0"
description = "Turn Solari browser-agent runs into shareable WebM demos and README GIFs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AgentReel" }]
keywords = ["solari", "browser", "agent", "rrweb", "demo", "gif"]
dependencies = [
  "solari-browser>=0.1.2",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
agentreel = "agentreel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentreel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
